appId: com.notadown.app
productName: NotaDown
copyright: Copyright © 2026 NotaDown contributors

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - renderer/**/*
  - '!renderer/**/*.map'
  - package.json

asar: true
publish:
  provider: github
  owner: NotaDown
  repo: NotaDown
artifactName: ${productName}.${version}-${arch}.${ext}

fileAssociations:
  # One entry per extension: Linux targets reject an array for ext.
  # icon resolves to notadown-file.ico on Windows and notadown-file.icns on macOS.
  - ext: md
    name: Markdown Document
    description: Markdown document
    role: Editor
    mimeType: text/markdown
    icon: assets/notadown-file.ico
  - ext: markdown
    name: Markdown Document
    description: Markdown document
    role: Editor
    mimeType: text/markdown
    icon: assets/notadown-file.ico
  - ext: mdown
    name: Markdown Document
    description: Markdown document
    role: Editor
    mimeType: text/markdown
    icon: assets/notadown-file.ico
  - ext: mkd
    name: Markdown Document
    description: Markdown document
    role: Editor
    mimeType: text/markdown
    icon: assets/notadown-file.ico

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  include: packaging/installer.nsh

mac:
  icon: assets/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity

linux:
  icon: assets/icon.png
  executableName: notadown
  syncDesktopName: true
  target:
    - AppImage
    - deb
  category: Office
  maintainer: NotaDown contributors
