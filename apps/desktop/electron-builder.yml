appId: com.notadown.app
productName: NotaDown
copyright: Copyright © 2026 NotaDown contributors

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - renderer/**/*
  - package.json

asar: true
publish: null

fileAssociations:
  - ext:
      - md
      - markdown
      - mdown
      - mkd
    name: Markdown Document
    description: Markdown document
    role: Editor
    mimeType: text/markdown

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  icon: assets/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity

linux:
  icon: assets/icon.png
  executableName: notadown
  syncDesktopName: true
  target:
    - AppImage
  category: Office
  maintainer: NotaDown contributors
