name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify the root version against (leave empty for a branch build)
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches the root package version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ "${TAG#v}" = "$TAG" ]; then
            echo "Not a v* tag (${TAG}); skipping version verification."
            exit 0
          fi
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs'
          const pkgVersion = JSON.parse(readFileSync('package.json', 'utf8')).version
          const tag = process.env.TAG.slice(1)
          const split = (v) => {
            const i = v.indexOf('-')
            return i === -1 ? { core: v, pre: '' } : { core: v.slice(0, i), pre: v.slice(i + 1) }
          }
          const t = split(tag)
          const p = split(pkgVersion)
          if (t.core !== p.core || t.pre !== p.pre) {
            console.error(`Version mismatch: tag v${tag} does not match root package.json version ${pkgVersion}`)
            process.exit(1)
          }
          console.log(`Verified tag v${tag} against root package.json version ${pkgVersion}.`)
          EOF

  web:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build web edition
        run: pnpm --filter @notadown/web build

      - name: Package web edition
        run: |
          cd apps/web/dist
          zip -qr "$GITHUB_WORKSPACE/notadown-web.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: notadown-web.zip
          if-no-files-found: error

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop edition
        run: pnpm package:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - web
      - desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          name: NotaDown ${{ github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
