name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify the root version against (leave empty for a branch build)
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Release convention shared by the abrooka apps: the tag is `v` plus the root
      # package.json version, so a pre-release carries the same suffix in both
      # places (root `0.1.0-beta.1` with tag `v0.1.0-beta.1`).
      - name: Verify tag matches the root package version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ "${TAG#v}" = "$TAG" ]; then
            echo "Not a v* tag (${TAG}); skipping version verification."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag ${TAG} is not version ${version}; bump the root package.json and re-tag." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Verified ${TAG} against the root package.json version ${version}."

  web:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build web edition
        run: pnpm --filter @notadown/web build

      # The live site mirrors stable releases only, so a pre-release leaves the
      # artifact out and the pages job below is skipped too.
      - name: Upload Pages artifact
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

      - name: Package web edition
        run: |
          cd apps/web/dist
          zip -qr "$GITHUB_WORKSPACE/notadown-web.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: notadown-web.zip
          if-no-files-found: error

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop edition
        run: pnpm package:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - web
      - desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write release notes
        run: |
          awk -v ver="${GITHUB_REF_NAME}" '
            $0 ~ ("^## " ver "[ \t\r]*$") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No \`${GITHUB_REF_NAME}\` entry in CHANGELOG.md yet." > release-body.md
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write download links
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mirror="https://v6.gh-proxy.org/${base}"
          asset() { find artifacts -maxdepth 1 -type f -name "$1" -printf '%f\n' -quit; }
          link() { printf '[%s](%s/%s) ([国内镜像](%s/%s))' "$1" "$base" "$2" "$mirror" "$2"; }

          win_exe=$(asset 'NotaDown*-x64.exe')
          mac_x64=$(asset 'NotaDown*-x64.dmg')
          mac_arm64=$(asset 'NotaDown*-arm64.dmg')
          linux_appimage=$(asset 'NotaDown*.AppImage')
          linux_deb=$(asset 'NotaDown*.deb')
          web_zip=$(asset 'notadown-web.zip')

          # A pattern that stops matching would otherwise publish an empty link
          for name in win_exe mac_x64 mac_arm64 linux_appimage linux_deb web_zip; do
            if [ -z "${!name}" ]; then
              echo "Missing release asset for ${name}" >&2
              exit 1
            fi
          done

          {
            printf '\n### 下载 · Downloads\n\n'
            printf -- '- **Windows (x64)**: '
            link 'Installer' "$win_exe"
            printf '\n- **macOS (Apple Silicon)**: '
            link 'DMG' "$mac_arm64"
            printf ' · **macOS (Intel)**: '
            link 'DMG' "$mac_x64"
            printf '\n- **Linux (x64)**: '
            link 'AppImage' "$linux_appimage"
            printf ' · '
            link 'deb' "$linux_deb"
            printf '\n- **Web**: '
            link '离线包' "$web_zip"
            printf '\n'
          } >> release-body.md

      - uses: softprops/action-gh-release@v3
        with:
          name: NotaDown ${{ github.ref_name }}
          body_path: release-body.md
          files: artifacts/**/*
          # Release convention shared by the abrooka apps: a tag with a hyphen
          # after the version (v1.2.3-beta.1) publishes as a GitHub pre-release;
          # a plain v1.2.3 tag publishes as the current stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Publishes the web build of this release to GitHub Pages. Kept separate from
  # publish so a failed deployment is retried on its own; the build itself comes
  # from the web job's Pages artifact. Requires the one-time Pages setup in
  # docs/release-process.md.
  pages:
    needs: publish
    # Stable releases only: the live site always mirrors the newest stable version.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5

  # Separate job so a failed upload can be retried on its own ("Re-run failed
  # jobs") without rebuilding the release. See docs/release-process.md.
  metadata:
    needs: publish
    # Stable releases only: the generic update channel has no prerelease filter.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build channel files
        run: node scripts/update-metadata.mjs --tag "$GITHUB_REF_NAME"

      - name: Install coscli
        env:
          COSCLI_VERSION: v1.0.9
          COSCLI_SHA256: a07de5ba2800147a700ed29036b0c76a4229088cee68e1682d0eae19b638a915
        run: |
          curl -fsSL "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/coscli-${COSCLI_VERSION}-linux-amd64" -o coscli
          echo "${COSCLI_SHA256}  coscli" | sha256sum -c -
          chmod +x coscli
          ./coscli --version

      - name: Upload channel files
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          umask 077
          config="$RUNNER_TEMP/cos.yaml"
          # The CI key only has COS data-write permission, so coscli must not
          # HEAD the bucket to detect its type; declare the bucket in config.
          cat > "$config" <<EOF
          cos:
            base:
              secretid: ${TENCENTCLOUD_SECRET_ID}
              secretkey: ${TENCENTCLOUD_SECRET_KEY}
              protocol: https
              disableautofetchbuckettype: "true"
            buckets:
              - name: notadown-1302260381
                alias: notadown
                region: ap-shanghai
                endpoint: cos.ap-shanghai.myqcloud.com
          EOF
          ./coscli --config-path "$config" cp update-metadata/latest.yml cos://notadown/updater/latest.yml
          ./coscli --config-path "$config" cp update-metadata/latest-linux.yml cos://notadown/updater/latest-linux.yml
          rm -f "$config"
