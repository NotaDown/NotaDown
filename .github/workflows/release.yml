name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify the root version against (leave empty for a branch build)
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Release convention shared by the abrooka apps: the tag is `v` plus the root
      # package.json version, so a pre-release carries the same suffix in both
      # places (root `0.1.0-beta.1` with tag `v0.1.0-beta.1`).
      - name: Verify tag matches the root package version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ "${TAG#v}" = "$TAG" ]; then
            echo "Not a v* tag (${TAG}); skipping version verification."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag ${TAG} is not version ${version}; bump the root package.json and re-tag." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Verified ${TAG} against the root package.json version ${version}."

  web:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build web edition
        run: pnpm --filter @notadown/web build

      - name: Package web edition
        run: |
          cd apps/web/dist
          zip -qr "$GITHUB_WORKSPACE/notadown-web.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: notadown-web.zip
          if-no-files-found: error

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop edition
        run: pnpm package:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - web
      - desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write release notes
        run: |
          awk -v ver="${GITHUB_REF_NAME}" '
            $0 ~ ("^## " ver "[ \t\r]*$") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No \`${GITHUB_REF_NAME}\` entry in CHANGELOG.md yet." > release-body.md
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write download links
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mirror="https://v6.gh-proxy.org/${base}"
          asset() { find artifacts -maxdepth 1 -type f -name "$1" -printf '%f\n' -quit; }
          urlencode() { printf '%s' "${1// /%20}"; }
          link() {
            local file
            file=$(urlencode "$2")
            printf '[%s](%s/%s) ([国内镜像](%s/%s))' "$1" "$base" "$file" "$mirror" "$file"
          }

          win_exe=$(asset 'NotaDown*-x64.exe')
          mac_x64=$(asset 'NotaDown*-x64.dmg')
          mac_arm64=$(asset 'NotaDown*-arm64.dmg')
          linux_appimage=$(asset 'NotaDown*-x64.AppImage')
          linux_deb=$(asset 'NotaDown*-x64.deb')
          web_zip=$(asset 'notadown-web.zip')

          {
            printf '\n### 下载 · Downloads\n\n'
            printf -- '- **Windows (x64)**: '
            link 'Installer' "$win_exe"
            printf '\n- **macOS (Apple Silicon)**: '
            link 'DMG' "$mac_arm64"
            printf ' · **macOS (Intel)**: '
            link 'DMG' "$mac_x64"
            printf '\n- **Linux (x64)**: '
            link 'AppImage' "$linux_appimage"
            printf ' · '
            link 'deb' "$linux_deb"
            printf '\n- **Web**: '
            link '离线包' "$web_zip"
            printf '\n'
          } >> release-body.md

      - uses: softprops/action-gh-release@v3
        with:
          name: NotaDown ${{ github.ref_name }}
          body_path: release-body.md
          files: artifacts/**/*
          # Release convention shared by the abrooka apps: a tag with a hyphen
          # after the version (v1.2.3-beta.1) publishes as a GitHub pre-release;
          # a plain v1.2.3 tag publishes as the current stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}
